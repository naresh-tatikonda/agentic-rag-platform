services:

  rag-api:
    image: agentic-rag-platform:latest
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    # .env's DATABASE_URL/POSTGRES_HOST point at localhost — correct for
    # running the app directly on the host, but "localhost" inside this
    # container refers to the container itself, not the ragdb container.
    # Override to the compose service name, which Docker's internal DNS
    # resolves to ragdb's container IP on rag-network.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ragdb:5432/${POSTGRES_DB}
      POSTGRES_HOST: ragdb
    depends_on:
      - ragdb
    networks:
      - rag-network

  ragdb:
    image: pgvector/pgvector:pg16
    container_name: ragdb
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  pgdata:
    external: true    # ← uses existing volume, does NOT wipe your data
